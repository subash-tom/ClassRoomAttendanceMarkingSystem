<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sessions</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 13px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #343a40;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f9fa;
        }

        .no-data {
            padding: 25px;
            text-align: center;
            color: #777;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        @media (max-width: 768px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            .top-bar {
                flex-direction: column;
                gap: 15px;
            }

            table {
                font-size: 12px;
            }

            th,
            td {
                padding: 8px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Classroom Sessions</h1>


    <!-- TOP BAR -->

    <div class="top-bar">

        <a th:href="@{/index}"
           class="btn btn-primary">
            Mark Attendance
        </a>

        <a th:href="@{/sessions/new}"
           class="btn btn-primary">
            + Add New Session
        </a>

    </div>


    <!-- SESSION TABLE -->

    <table>

        <thead>

        <tr>

            <th>S.No</th>

            <th>Session ID</th>

            <th>Subject Code</th>

            <th>Subject Name</th>

            <th>Date</th>

            <th>Start Time</th>

            <th>End Time</th>

            <th>Action</th>

        </tr>

        </thead>


        <tbody>

        <!--
            IMPORTANT:
            Use "item" instead of "session".
            "session" is a reserved Thymeleaf variable name.
        -->

        <tr th:each="item, stat : ${sessions}">

            <td th:text="${stat.count}">
                1
            </td>


            <td th:text="${item.sessionId}">
                1
            </td>


            <td th:text="${item.subject.subjectCode}">
                CS101
            </td>


            <td th:text="${item.subject.subjectName}">
                Computer Science
            </td>


            <td th:text="${item.sessionDate}">
                2026-09-28
            </td>


            <td th:text="${item.startTime}">
                09:00
            </td>


            <td th:text="${item.endTime}">
                10:00
            </td>


            <td>

                <div class="action-buttons">

                    <a th:href="@{/sessions/delete/{id}(id=${item.sessionId})}"
                       class="btn btn-danger"
                       onclick="return confirm('Are you sure you want to delete this session?');">
                        Delete
                    </a>

                </div>

            </td>

        </tr>


        <!-- NO DATA -->

        <tr th:if="${#lists.isEmpty(sessions)}">

            <td colspan="8"
                class="no-data">

                No sessions found.

                <br><br>

                <a th:href="@{/sessions/new}"
                   class="btn btn-primary">
                    Add First Session
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
