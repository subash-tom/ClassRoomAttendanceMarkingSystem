<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Subjects</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
        }

        .add-btn {
            display: inline-block;
            padding: 10px 18px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f1f1;
        }

        .edit {
            color: #198754;
            text-decoration: none;
            margin-right: 10px;
        }

        .delete {
            color: #dc3545;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Subject Management</h2>

    <a class="add-btn"
       th:href="@{/subjects/new}">
        + Add Subject
    </a>
    <a th:href="@{/index}"
           class="add-btn">
            Mark Attendance
        </a>

    <table>

        <thead>

        <tr>

            <th>ID</th>

            <th>Subject Code</th>

            <th>Subject Name</th>

            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="subject : ${subjects}">

            <td th:text="${subject.subjectId}">
                1
            </td>

            <td th:text="${subject.subjectCode}">
                CS101
            </td>

            <td th:text="${subject.subjectName}">
                Java Programming
            </td>

            <td>

                <a class="edit"
                   th:href="@{/subjects/edit/{id}(id=${subject.subjectId})}">
                    Edit
                </a>

                <a class="delete"
                   th:href="@{/subjects/delete/{id}(id=${subject.subjectId})}"
                   onclick="return confirm('Are you sure you want to delete this subject?');">
                    Delete
                </a>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(subjects)}">

            <td colspan="4"
                style="text-align:center;">
                No subjects found.
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
