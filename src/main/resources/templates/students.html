<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Students</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 20px;
        }

        .add-btn {
            display: inline-block;
            padding: 10px 18px;
            background: #198754;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #212529;
            color: white;
        }

        .edit {
            background: #0d6efd;
            color: white;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        .delete {
            background: #dc3545;
            color: white;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management</h1>

    <a href="/students/new" class="add-btn">
        + Add Student
    </a>
     <a th:href="@{/index}"
           class="add-btn">
            Mark Attendance
        </a>


    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Roll Number</th>
            <th>Email</th>
            <th>Contact</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="student : ${students}">

            <td th:text="${student.studentId}"></td>

            <td th:text="${student.name}"></td>

            <td th:text="${student.rollNumber}"></td>

            <td th:text="${student.email}"></td>

            <td th:text="${student.contact}"></td>

            <td>

                <a
                    th:href="@{/students/edit/{id}(id=${student.studentId})}"
                    class="edit">
                    Edit
                </a>

                <a
                    th:href="@{/students/delete/{id}(id=${student.studentId})}"
                    class="delete"
                    onclick="return confirm('Delete this student?');">
                    Delete
                </a>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(students)}">
            <td colspan="6">
                No students found.
            </td>
        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
